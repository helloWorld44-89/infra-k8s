apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "8.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    admin:
      existingSecret: grafana-secrets
      userKey: GF_SECURITY_ADMIN_USER
      passwordKey: GF_SECURITY_ADMIN_PASSWORD
    persistence:
      enabled: true
      size: 2Gi
    env:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana-postgres-rw.databases.svc.cluster.local:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_SSL_MODE: disable
    envValueFrom:
      GF_DATABASE_USER:
        secretKeyRef:
          name: grafana-db-credentials
          key: username
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-db-credentials
          key: password
    grafana.ini:
      server:
        root_url: https://grafana.conderhome.xyz
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        folder: /tmp/dashboards
        searchNamespace: monitoring
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus-server.monitoring.svc.cluster.local
            isDefault: true
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc.cluster.local:3100
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.conderhome.xyz
      paths:
        - /
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi