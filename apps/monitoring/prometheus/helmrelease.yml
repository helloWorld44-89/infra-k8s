apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "25.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    server:
      persistentVolume:
        enabled: true
        size: 5Gi
      retentionSize: 4GB
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - prometheus.conderhome.xyz
        paths:
          - /
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 3Gi
      # Liveness probe tuned for NFS-backed TSDB: WAL replay takes 6+ minutes after a pod restart.
      # Chart default (30s delay + 3x15s=45s) killed Prometheus before TSDB was ready → false-positive DatasourceNoData alerts.
      # 300s initial delay + 10 failures x 15s = 450s total window (7.5 min) to cover NFS WAL replay.
      # Note: this chart uses scalar fields (livenessProbeInitialDelay etc), NOT a nested livenessProbe object.
      livenessProbeInitialDelay: 300
      livenessProbePeriodSeconds: 15
      livenessProbeTimeout: 10
      livenessProbeFailureThreshold: 10
      livenessProbeSuccessThreshold: 1
      # Readiness probe: timeout bumped from default 4s (NFS WAL replay takes up to 8s).
      readinessProbeInitialDelay: 30
      readinessProbePeriodSeconds: 5
      readinessProbeTimeout: 10
      readinessProbeFailureThreshold: 3
      readinessProbeSuccessThreshold: 1
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    extraScrapeConfigs: |
      - job_name: 'homelab-proxmox'
        static_configs:
          - targets: ['192.168.5.10:9100']
            labels: {hostname: 'Balerion'}
          - targets: ['192.168.5.12:9100']
            labels: {hostname: 'Smaug'}
          - targets: ['192.168.5.11:9100']
            labels: {hostname: 'toothless'}

      - job_name: 'homelab-servers'
        static_configs:
          - targets: ['192.168.5.43:9100']
            labels: {hostname: 'prod-ubsrv-02'}
          - targets: ['192.168.5.42:9100']
            labels: {hostname: 'prod-ubsrv-03'}
          - targets: ['192.168.5.45:9100']
            labels: {hostname: 'dev-ubsrv-01'}
          - targets: ['192.168.5.99:9100']
            labels: {hostname: 'prod-agents-01'}

      # Pi-hole servers - aspirational, node_exporter not yet installed
      # - job_name: 'homelab-pi'
      #   static_configs:
      #     - targets: ['192.168.5.5:9100']
      #       labels: {hostname: 'pisrv01'}
      #     - targets: ['192.168.5.6:9100']
      #       labels: {hostname: 'pisrv02'}
      - job_name: 'homelab-windows'
        static_configs:
          - targets: ['192.168.5.26:9182']
            labels: {hostname: 'winsrv02'}
