apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      loki:
        containers:
          app:
            image:
              repository: grafana/loki
              tag: 2.9.1
            env:
              TZ: America/Chicago
    service:
      loki:
        controller: loki
        ports:
          http:
            port: 3100
    ingress:
      loki:
        className: traefik
        hosts:
          - host: loki.conderhome.xyz
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: loki
                  port: http
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
