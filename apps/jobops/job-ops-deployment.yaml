apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: job-ops
  name: job-ops
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-ops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: job-ops
    spec:
      containers:
        - env:
            - name: CODEX_HOME
              value: /app/codex-home
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: PYTHON_PATH
              value: /usr/bin/python3
          envFrom:
            - configMapRef:
                name: env
            - secretRef:
                name: jobops-secrets
          image: ghcr.io/dakheera47/job-ops:v0.9.0
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          name: job-ops
          ports:
            - containerPort: 3001
              protocol: TCP
          volumeMounts:
            - mountPath: /app/data
              name: job-ops-claim0
            - mountPath: /app/codex-home
              name: codex-home
      restartPolicy: Always
      volumes:
        - name: job-ops-claim0
          persistentVolumeClaim:
            claimName: job-ops-claim0
        - name: codex-home
          persistentVolumeClaim:
            claimName: codex-home
