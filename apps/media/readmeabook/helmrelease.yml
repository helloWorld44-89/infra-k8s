apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: readmeabook
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      readmeabook:
        containers:
          app:
            image:
              repository: ghcr.io/kikootwo/readmeabook
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              PUBLIC_URL: "https://audiobook.conderhome.xyz"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3030
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3030
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    service:
      readmeabook:
        controller: readmeabook
        ports:
          http:
            port: 3030
    ingress:
      readmeabook:
        className: traefik
        hosts:
          - host: audiobook.conderhome.xyz
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: readmeabook
                  port: http
        tls:
          - hosts:
              - audiobook.conderhome.xyz
            secretName: wildcard-conderhome-xyz-tls
    persistence:
      config:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 1Gi
        globalMounts:
          - path: /app/config
      cache:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 5Gi
        globalMounts:
          - path: /app/cache
      pgdata:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 5Gi
        globalMounts:
          - path: /var/lib/postgresql/data
      redis:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 1Gi
        globalMounts:
          - path: /var/lib/redis
      downloads:
        existingClaim: downloads-pvc
        globalMounts:
          - path: /downloads
      media:
        existingClaim: audiobooks-pvc
        globalMounts:
          - path: /media
