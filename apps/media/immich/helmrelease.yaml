apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: "0.13.x"
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.2.2
            env:
              DB_HOSTNAME: shared-postgres-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: password

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc

    valkey:
      enabled: true

    server:
      ingress:
        main:
          enabled: false

    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true