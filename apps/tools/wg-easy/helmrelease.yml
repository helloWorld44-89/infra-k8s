apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wg-easy
  namespace: tools
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      app:
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            kubernetes.io/hostname: prod-k3s-master
        containers:
          app:
            image:
              repository: ghcr.io/wg-easy/wg-easy
              tag: "15"
            env:
              PORT: "51821"
              HOST: "0.0.0.0"
              INSECURE: "false"
              INIT_ENABLED: "false"
              DISABLE_IPV6: "false"
              DEBUG: "Server,WireGuard,Database,CMD"
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
                  - SYS_MODULE
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
    persistence:
      wireguard-data:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 1Gi
        advancedMounts:
          app:
            app:
              - path: /etc/wireguard
      lib-modules:
        type: hostPath
        hostPath: /lib/modules
        advancedMounts:
          app:
            app:
              - path: /lib/modules
                readOnly: true
