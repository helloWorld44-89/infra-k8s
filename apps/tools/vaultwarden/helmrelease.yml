apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: tools
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      app:
        containers:
          app:
            image:
              repository: vaultwarden/server
              tag: "1.37.4"
            env:
              TZ: "America/Chicago"
              DOMAIN: "https://vault.conderhome.xyz"
              ROCKET_PROFILE: "release"
              ROCKET_ADDRESS: "0.0.0.0"
              ROCKET_PORT: "80"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: 80
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
    persistence:
      data:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 1Gi
        advancedMounts:
          app:
            app:
              - path: /data
    ingress:
      app:
        className: traefik
        hosts:
          - host: vault.conderhome.xyz
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - vault.conderhome.xyz
            secretName: wildcard-conderhome-xyz-tls
