apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nexustale
  namespace: tools
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      nexustale-redis:
        containers:
          app:
            image:
              repository: redis
              tag: 7-alpine
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 256Mi
      nexustale-api:
        containers:
          app:
            image:
              repository: ghcr.io/helloworld44-89/nexustale/api
              tag: v0.3.2
            env:
              NEXUSTALE_AUTH_JWTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: nexustale-secrets
                    key: JWT_SECRET
              NEXUSTALE_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: nexustale-secrets
                    key: ENCRYPTION_KEY
              NEXUSTALE_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: nexustale-secrets
                    key: NEXUSTALE_DB_URL
              NEXUSTALE_REDIS_URL: "redis://nexustale-nexustale-redis:6379"
              NEXUSTALE_DB_MIGRATIONSPATH: "file:///migrations"
              NEXUSTALE_SERVER_REGISTRATIONOPEN: "true"
              NEXUSTALE_SERVER_PORT: "8080"
              NEXUSTALE_GIT_REPOSPATH: "/data/repos"
              NEXUSTALE_SERVER_ALLOWEDORIGIN: "https://nexustale.conderhome.xyz"
              NEXUSTALE_SERVER_MODE: "release"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      nexustale-frontend:
        containers:
          app:
            image:
              repository: ghcr.io/helloworld44-89/nexustale/frontend
              tag: v0.3.2
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 256Mi
    service:
      nexustale-redis:
        controller: nexustale-redis
        ports:
          redis:
            port: 6379
      nexustale-api:
        controller: nexustale-api
        ports:
          http:
            port: 8080
      nexustale-frontend:
        controller: nexustale-frontend
        ports:
          http:
            port: 80
    persistence:
      nginx-conf:
        type: configMap
        name: nexustale-nginx-conf
        advancedMounts:
          nexustale-frontend:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
    ingress:
      nexustale-frontend:
        className: traefik
        hosts:
          - host: nexustale.conderhome.xyz
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: nexustale-frontend
                  port: http
        tls:
          - hosts:
              - nexustale.conderhome.xyz
            secretName: wildcard-conderhome-xyz-tls
