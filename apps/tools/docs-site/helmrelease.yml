apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docs-site
  namespace: tools
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      docs-site:
        containers:
          app:
            image:
              repository: ghcr.io/helloworld44-89/homelab-docs
              tag: latest
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
    service:
      docs-site:
        controller: docs-site
        ports:
          http:
            port: 80
    ingress:
      docs-site:
        className: traefik
        hosts:
          - host: docs.conderhome.xyz
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: docs-site
                  port: http
        tls:
          - hosts:
              - docs.conderhome.xyz
            secretName: wildcard-conderhome-xyz-tls
