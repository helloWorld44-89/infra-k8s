apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keyshift
  namespace: tools
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      app:
        containers:
          app:
            image:
              repository: ghcr.io/helloworld44-89/keyshift
              tag: latest
            env:
              FLASK_DEBUG: "false"
              DATABASE_URL: "sqlite:///KeyShift.db"
              SESSION_COOKIE_SECURE: "true"
              SESSION_COOKIE_HTTPONLY: "true"
              SESSION_COOKIE_SAMESITE: "Lax"
              TZ: "America/Chicago"
              FLASK_ENV: "production"
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: keyshift-secrets
                    key: SECRET_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5000
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5000
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      app:
        controller: app
        ports:
          http:
            port: 5000
    persistence:
      config:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 1Gi
        advancedMounts:
          app:
            app:
              - path: /app/app/config/file
      db:
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 1Gi
        advancedMounts:
          app:
            app:
              - path: /app/instance
    ingress:
      app:
        className: traefik
        hosts:
          - host: keyshift.conderhome.xyz
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - keyshift.conderhome.xyz
            secretName: wildcard-conderhome-xyz-tls
