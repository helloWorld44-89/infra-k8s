name: Build and publish homelab docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-build/**"
      - ".github/workflows/docs-site.yml"
  schedule:
    # Catches changes made only in the separate `infra` repo (its docs
    # aren't committed here, just cloned at build time), since there's
    # no cross-repo push trigger wired up. Daily is enough for a homelab.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra-k8s
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docs site image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docs-build/Dockerfile
          push: true
          tags: ghcr.io/helloworld44-89/homelab-docs:latest
          secrets: |
            infra_repo_pat=${{ secrets.INFRA_REPO_PAT }}
