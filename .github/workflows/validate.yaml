name: Validate Manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kustomize
        uses: multani/action-setup-kustomize@v1
        with:
          version: 5.4.3

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Build and validate infrastructure
        run: |
          kustomize build infrastructure/ \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.31.0

      - name: Build and validate apps
        run: |
          kustomize build apps/ \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.31.0

      - name: Verify secrets are SOPS-encrypted
        run: |
          fail=0
          while IFS= read -r f; do
            if ! grep -q "^sops:" "$f"; then
              echo "::error file=$f::Secret file is not SOPS-encrypted"
              fail=1
            fi
          done < <(find . -name "secrets.y*ml" -not -path "./.git/*")
          exit $fail
