apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "1.15.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    installCRDs: true
    # Resource limits
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # Prometheus metrics
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        namespace: monitoring
    # Webhook
    webhook:
      timeout: 10s
    # Feature gates
    extraArgs:
      - --feature-gates=ExperimentalCertificateSigningRequestControllers=true